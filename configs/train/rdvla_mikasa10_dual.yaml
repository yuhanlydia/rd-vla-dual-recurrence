model:
  config_path: outputs/mikasa10_baseline/rdvla_spatial_40k
  vlm_path: pretrained_models/prism-qwen25-extra-dinosiglip-224px-0_5b
  use_minivlm: false
  num_images_in_input: 2
  use_proprio: true
  use_lora: false

action_head:
  type: recurrent
  recurrent:
    hidden_dim: 896
    num_heads: 8
    prelude_vlm_layers: [11]
    recurrent_vlm_layers: [23, 23]
    coda_vlm_layers: [23]
    action_chunk_len: 8
    action_dim: 7
    mean_recurrence: 12
    backprop_depth: 8
    random_iterations: false
    use_persistent_memory: true
    memory_tokens: 8
    memory_dim: 512
    memory_layers: 2
    memory_heads: 8
    memory_ffn_dim: 2048
    memory_dropout: 0.3

data:
  data_root_dir: data/mikasa_robo_vla_rlds
  dataset_name: mikasa10
  use_mikasa_episodic: true
  episodes_per_env: 200
  validation_episodes_per_env: 50
  image_aug: false
  mikasa_env_names:
    - remember_color_9_vla_v0
    - remember_color_9_long_vla_v0
    - chain_of_colors_5_vla_v0
    - chain_of_colors_5_long_vla_v0
    - shell_game_shuffle_touch_vla_v0
    - shell_game_shuffle_touch_long_vla_v0
    - blink_count_button_press_hard_vla_v0
    - blink_count_button_press_hard_long_vla_v0
    - timed_transfer_hard_vla_v0
    - timed_transfer_hard_long_vla_v0

optimizer:
  learning_rate: 0.0001
  num_steps_before_decay: 8000

# Frozen-backbone memory-only stage fits at batch 24 on a 24 GB RTX 3090.
batch_size: 24
grad_accumulation_steps: 1
env_tbptt_length: 16
k_train: [1, 2, 4, 8, 12]
train_memory_only: true
max_steps: 10000
max_wall_time_hours: 10
use_val_set: true
val_freq: 1000
val_time_limit: 60
save_freq: 2000
save_latest_only: true
merge_lora: false
output_dir: outputs/mikasa10_dual
run_name: rdvla-mikasa10-dual
use_wandb: false
resume: true
restore_trainer_state: false
resume_path: outputs/mikasa10_baseline/rdvla_spatial_40k
resume_step: 40000
